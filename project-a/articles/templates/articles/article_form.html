{% extends "articles/base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<h1>{{ heading }}</h1>
<form method="post" enctype="multipart/form-data" class="panel">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">保存</button>
  {% if article %}<a href="{% url 'articles:detail' article.pk %}">取消</a>{% endif %}
</form>
{% endblock %}
